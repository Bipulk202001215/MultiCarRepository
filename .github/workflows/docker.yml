name: Build & Push Docker Image to Docker Hub

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Setup Docker Buildx with QEMU for multi-platform builds
      - uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # 3. Login to Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build & Push Image (multi-platform)
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: production
          tags: bipulk3335/multi-car-repository-frontend:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=bipulk3335/multi-car-repository-frontend:latest
          cache-to: type=inline


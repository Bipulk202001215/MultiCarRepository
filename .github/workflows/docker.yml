name: Build & Push Docker Image to Docker Hub

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - run: npm ci

      # 4. Build application
      - run: npm run build

      # 5. Setup Docker Buildx
      - uses: docker/setup-buildx-action@v3

      # 6. Login to Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build & Push Image
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: bipulk3335/multi-car-repository-frontend:latest
          platforms: linux/amd64
          cache-from: type=registry,ref=bipulk3335/multi-car-repository-frontend:buildcache
          cache-to: type=registry,ref=bipulk3335/multi-car-repository-frontend:buildcache,mode=max

